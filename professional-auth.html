<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Professional Google Login | SahiMilo</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script defer src="config.js?v=20260918-2"></script><script defer src="professional-auth.js?v=4"></script><style>body{background:#f5f8f5}.account-shell{min-height:calc(100vh - 73px);padding:38px 0 70px}.account-card{width:min(560px,94%);margin:auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}.account-card h1{font-size:32px;letter-spacing:-1px;margin:5px 0 6px}.account-card>p{color:var(--muted);margin:0 0 20px}.account-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}.account-tab{height:42px;border:1px solid var(--line);background:#fff;border-radius:10px;font-weight:800;cursor:pointer}.account-tab.active{background:var(--green);color:#fff;border-color:var(--green)}.account-form .field{margin-bottom:13px}.account-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.google-btn{width:100%;min-height:50px;display:flex;align-items:center;justify-content:center;gap:12px;border:1px solid #d8e0da;border-radius:11px;background:#fff;color:#202124;font-weight:800;cursor:pointer}.google-btn:hover{background:#f8faf8;border-color:#aebbb2}.google-mark{font-size:18px;font-weight:900;color:#4285f4}.account-note{font-size:12px;color:var(--muted);margin-top:15px}@media(max-width:620px){.account-grid{grid-template-columns:1fr}.account-shell{padding-top:22px}.account-card{padding:24px 20px}}</style></head><body><header class="site-header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">✓</span><span>Sahi<span>Milo</span></span></a><a class="nav-login" href="login-as.html">← Login options</a></div></header><main class="account-shell"><section class="account-card"><div class="eyebrow">PROFESSIONAL ACCOUNT</div><h1>Professional Login</h1><p>Google account se login karein ya naya professional account banayein.</p><div class="account-tabs"><button class="account-tab active" data-mode="login" type="button">Login</button><button class="account-tab" data-mode="signup" type="button">Create account</button></div><form id="professionalForm" class="account-form"><div id="professionalSignupFields" class="hidden"><label class="field"><span>Full name *</span><input id="professionalName" autocomplete="name"></label><div class="account-grid"><label class="field"><span>Mobile *</span><input id="professionalPhone" inputmode="tel"></label><label class="field"><span>WhatsApp</span><input id="professionalWhatsapp" inputmode="tel"></label></div><label class="field"><span>Category *</span><select id="professionalCategory"><option value="">Select category</option><option>Home Repair</option><option>Construction & Labour</option><option>Electronics & Appliances</option><option>Auto & Vehicle</option><option>Agriculture</option><option>Beauty & Personal Care</option><option>Education</option><option>Events & Functions</option><option>Health & Care</option><option>Business Services</option></select></label><label class="field"><span>Services, comma separated *</span><input id="professionalServices" placeholder="Electrician, Inverter fitting"></label><div class="account-grid"><label class="field"><span>Area *</span><input id="professionalArea"></label><label class="field"><span>Pincode *</span><input id="professionalPincode" inputmode="numeric" maxlength="6"></label></div><div class="account-grid"><label class="field"><span>City *</span><input id="professionalCity"></label><label class="field"><span>State *</span><input id="professionalState" value="Bihar"></label></div></div><button id="professionalSubmit" class="google-btn" type="submit"><span class="google-mark">G</span><span id="professionalButtonText">Continue with Google</span></button><p id="professionalMessage" class="notice hidden" role="alert"></p></form><p class="account-note">New professional profile admin approval tak pending rahegi. Google password sirf Google ke page par enter karein, SahiMilo par kabhi nahi.</p></section></main></body></html>
