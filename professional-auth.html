<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Professional Email OTP | SahiMilo</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script defer src="config.js?v=20260918-2"></script><script defer src="professional-auth.js?v=3"></script><style>body{background:#f5f8f5}.account-shell{min-height:calc(100vh - 73px);padding:38px 0 70px}.account-card{width:min(540px,94%);margin:auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}.account-card h1{font-size:32px;letter-spacing:-1px;margin:5px 0 6px}.account-card>p{color:var(--muted);margin:0 0 20px}.account-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}.account-tab{height:42px;border:1px solid var(--line);background:#fff;border-radius:10px;font-weight:800;cursor:pointer}.account-tab.active{background:var(--green);color:#fff;border-color:var(--green)}.account-form .field{margin-bottom:13px}.account-form .primary-btn{width:100%}.account-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.account-note{font-size:12px;color:var(--muted);margin-top:15px}.otp-box{background:var(--green-light);border:1px solid #cce6d5;border-radius:13px;padding:14px;margin-bottom:14px}.otp-box p{font-size:12px;color:var(--muted);margin:0 0 10px}@media(max-width:620px){.account-grid{grid-template-columns:1fr}.account-shell{padding-top:22px}}</style></head><body><header class="site-header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">✓</span><span>Sahi<span>Milo</span></span></a><a class="nav-whatsapp" href="login-as.html">← Login options</a></div></header><main class="account-shell"><section class="account-card"><div class="eyebrow">PROFESSIONAL ACCOUNT</div><h1>Email OTP Login</h1><p>Password ki zaroorat nahi. Email par mila 6-digit code use karein.</p><div class="account-tabs"><button class="account-tab active" data-mode="login" type="button">Login</button><button class="account-tab" data-mode="signup" type="button">Create account</button></div><form id="professionalForm" class="account-form"><div id="professionalSignupFields" class="hidden"><label class="field"><span>Full name</span><input id="professionalName"></label><div class="account-grid"><label class="field"><span>Mobile</span><input id="professionalPhone" inputmode="tel"></label><label class="field"><span>WhatsApp</span><input id="professionalWhatsapp" inputmode="tel"></label></div><label class="field"><span>Category</span><select id="professionalCategory"><option value="">Select category</option><option>Home Repair</option><option>Construction & Labour</option><option>Electronics & Appliances</option><option>Auto & Vehicle</option><option>Agriculture</option><option>Beauty & Personal Care</option><option>Education</option><option>Events & Functions</option><option>Health & Care</option><option>Business Services</option></select></label><label class="field"><span>Services, comma separated</span><input id="professionalServices" placeholder="Electrician, Inverter fitting"></label><div class="account-grid"><label class="field"><span>Area</span><input id="professionalArea"></label><label class="field"><span>Pincode</span><input id="professionalPincode" maxlength="6"></label></div><div class="account-grid"><label class="field"><span>City</span><input id="professionalCity"></label><label class="field"><span>State</span><input id="professionalState" value="Bihar"></label></div></div><label class="field"><span>Email address</span><input id="professionalEmail" type="email" autocomplete="email" required></label><div id="professionalOtpBox" class="otp-box hidden"><p>Email par mila 6-digit OTP enter karein.</p><label class="field"><span>OTP</span><input id="professionalOtp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456"></label></div><button id="professionalSubmit" class="primary-btn" type="submit">Send Login OTP</button><button id="resendOtp" class="secondary-btn hidden" type="button" style="width:100%;margin-top:8px">Resend OTP</button><p id="professionalMessage" class="notice hidden"></p></form><p class="account-note">New professional profiles admin approval tak pending rahengi. OTP kisi ke saath share na karein.</p></section></main></body></html>
