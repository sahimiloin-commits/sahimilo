<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Professional Login | SahiMilo</title><link rel="icon" type="image/png" href="sahimilo-logo.png"><link rel="stylesheet" href="style.css?v=20260920-logo2"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script defer src="config.js?v=20260918-2"></script><script defer src="professional-auth.js?v=5"></script><style>body{background:#f5f8f5}.account-shell{min-height:calc(100vh - 73px);padding:38px 0 70px}.account-card{width:min(520px,94%);margin:auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}.account-card h1{font-size:32px;letter-spacing:-1px;margin:5px 0 6px}.account-card>p{color:var(--muted);margin:0 0 20px}.account-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}.account-tab{height:42px;border:1px solid var(--line);background:#fff;border-radius:10px;font-weight:800;cursor:pointer}.account-tab.active{background:var(--green);color:#fff;border-color:var(--green)}.account-form .field{margin-bottom:13px}.account-form .primary-btn{width:100%}.account-note{font-size:12px;color:var(--muted);margin-top:15px}@media(max-width:620px){.account-shell{padding-top:22px}.account-card{padding:24px 20px}}</style></head><body><header class="site-header"><div class="container nav"><a class="brand" href="index.html"><img class="brand-mark" src="sahimilo-logo.png" alt="SahiMilo logo"><span>Sahi<span>Milo</span></span></a><a class="nav-login" href="login-as.html">← Login options</a></div></header><main class="account-shell"><section class="account-card"><div class="eyebrow">PROFESSIONAL ACCOUNT</div><h1 id="professionalHeading">Professional Login</h1><p id="professionalIntro">Apne Gmail aur SahiMilo PIN se login karein.</p><div class="account-tabs"><button class="account-tab active" data-mode="login" type="button">Login</button><button class="account-tab" data-mode="signup" type="button">Create account</button></div><form id="professionalForm" class="account-form"><label class="field"><span>Gmail address *</span><input id="professionalEmail" type="email" autocomplete="email" required placeholder="yourname@gmail.com"></label><label class="field"><span>6-digit SahiMilo PIN *</span><input id="professionalPin" type="password" inputmode="numeric" autocomplete="current-password" pattern="[0-9]{6}" maxlength="6" required placeholder="••••••"></label><label id="confirmPinField" class="field hidden"><span>Confirm PIN *</span><input id="professionalPinConfirm" type="password" inputmode="numeric" autocomplete="new-password" pattern="[0-9]{6}" maxlength="6" placeholder="••••••"></label><button id="professionalSubmit" class="primary-btn" type="submit">Login</button><p id="professionalMessage" class="notice hidden" role="alert"></p></form><p class="account-note">Account banane ke baad services, service area, experience aur contact details add karein. Profile admin approval tak pending rahegi.</p></section></main></body></html>
