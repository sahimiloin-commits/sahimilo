<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Customer Account | SahiMilo</title><link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
  <script defer src="config.js?v=20260918-2"></script><script defer src="customer-auth.js?v=1"></script><style>
    body{background:#f5f8f5}.account-shell{min-height:calc(100vh - 73px);padding:38px 0 70px}
    .account-card{width:min(520px,94%);margin:auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}
    .account-card h1{font-size:32px;letter-spacing:-1px;margin:5px 0 6px}.account-card>p{color:var(--muted);margin:0 0 20px}
    .account-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:22px}.account-tab{height:42px;border:1px solid var(--line);background:#fff;border-radius:10px;font-weight:800;cursor:pointer}.account-tab.active{background:var(--green);color:#fff;border-color:var(--green)}
    .account-form .field{margin-bottom:13px}.account-form .primary-btn{width:100%}.account-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.account-note{font-size:12px;color:var(--muted);margin-top:15px}
    .portal-header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}.portal-header h1{font-size:clamp(30px,4vw,44px);margin:4px 0}.portal-actions{display:flex;gap:10px}
    .portal-panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px}.portal-panel h2{margin:0 0 15px}.history-list{display:grid;gap:12px}
    .history-card{border:1px solid var(--line);border-radius:14px;padding:16px}.history-top{display:flex;justify-content:space-between;gap:12px}.history-card p{color:var(--muted);font-size:13px;margin:8px 0 0}
    .status-badge{display:inline-block;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:800;text-transform:capitalize;background:#fff4cf;color:#775b00}
    @media(max-width:620px){.account-grid{grid-template-columns:1fr}.portal-header{flex-direction:column}.portal-actions{width:100%}.portal-actions>*{flex:1}.account-shell{padding-top:22px}}
  </style></head><body>
<header class="site-header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">✓</span><span>Sahi<span>Milo</span></span></a><a class="nav-whatsapp" href="login-as.html">← Login options</a></div></header>
<main class="account-shell"><section class="account-card"><div class="eyebrow">CUSTOMER ACCOUNT</div><h1>Customer Login</h1><p>Service requests aur history manage karein.</p>
<div class="account-tabs"><button class="account-tab active" data-mode="login" type="button">Login</button><button class="account-tab" data-mode="signup" type="button">Create account</button></div>
<form id="customerForm" class="account-form"><label id="nameField" class="field hidden"><span>Full name</span><input id="customerName" autocomplete="name"></label><label class="field"><span>Email</span><input id="customerEmail" type="email" autocomplete="username" required></label><label class="field"><span>Password</span><input id="customerPassword" type="password" minlength="8" autocomplete="current-password" required></label><button id="customerSubmit" class="primary-btn" type="submit">Login</button><p id="customerMessage" class="notice hidden" role="alert"></p></form>
<p class="account-note">Account banane par aap SahiMilo Privacy Policy aur Terms se sehmat hote hain.</p></section></main></body></html>
