<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Set New PIN | SahiMilo</title><link rel="icon" type="image/png" href="sahimilo-logo-selected.png"><link rel="stylesheet" href="style.css?v=20260920-trust1"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script defer src="config.js?v=20260918-2"></script><script defer src="reset-pin.js?v=1"></script><style>body{background:#f5f8f5}.account-shell{min-height:calc(100vh - 73px);padding:38px 0 70px}.account-card{width:min(520px,94%);margin:auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}.account-card h1{font-size:32px;letter-spacing:-1px;margin:5px 0 6px}.account-card>p{color:var(--muted);margin:0 0 20px}.account-form .field{margin-bottom:13px}.account-form .primary-btn{width:100%}.account-note{font-size:12px;color:var(--muted);margin-top:15px}@media(max-width:620px){.account-shell{padding-top:22px}.account-card{padding:24px 20px}}</style></head><body><header class="site-header"><div class="container nav"><a class="brand" href="index.html"><img class="brand-mark" src="sahimilo-logo-selected.png" alt="SahiMilo logo"><span>Sahi<span>Milo</span></span></a><a class="nav-login" href="login-as.html">← Login options</a></div></header><main class="account-shell"><section class="account-card"><div class="eyebrow">SECURE ACCOUNT ACCESS</div><h1 id="resetHeading">Set your SahiMilo PIN</h1><p id="resetIntro">Apna naya 6-digit PIN banayein. Yeh PIN SahiMilo admin ko dikhayi nahi dega.</p><form id="resetPinForm" class="account-form hidden"><label class="field"><span>New 6-digit PIN *</span><input id="newPin" type="password" inputmode="numeric" autocomplete="new-password" pattern="[0-9]{6}" maxlength="6" required placeholder="••••••"></label><label class="field"><span>Confirm PIN *</span><input id="confirmNewPin" type="password" inputmode="numeric" autocomplete="new-password" pattern="[0-9]{6}" maxlength="6" required placeholder="••••••"></label><button id="resetPinSubmit" class="primary-btn" type="submit">Save New PIN</button></form><p id="resetPinMessage" class="notice" role="alert">Secure link verify kiya ja raha hai...</p></section></main></body></html>
