<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Forgot PIN | SahiMilo</title><link rel="icon" type="image/png" href="sahimilo-logo-selected.png"><link rel="stylesheet" href="style.css?v=20260920-trust1"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script defer src="config.js?v=20260918-2"></script><script defer src="forgot-pin.js?v=1"></script><style>body{background:#f5f8f5}.account-shell{min-height:calc(100vh - 73px);padding:38px 0 70px}.account-card{width:min(520px,94%);margin:auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}.account-card h1{font-size:32px;letter-spacing:-1px;margin:5px 0 6px}.account-card>p{color:var(--muted);margin:0 0 20px}.account-form .field{margin-bottom:13px}.account-form .primary-btn{width:100%}.account-note{font-size:12px;color:var(--muted);margin-top:15px}@media(max-width:620px){.account-shell{padding-top:22px}.account-card{padding:24px 20px}}</style></head><body><header class="site-header"><div class="container nav"><a class="brand" href="index.html"><img class="brand-mark" src="sahimilo-logo-selected.png" alt="SahiMilo logo"><span>Sahi<span>Milo</span></span></a><a class="nav-login" href="login-as.html">← Login options</a></div></header><main class="account-shell"><section class="account-card"><div class="eyebrow">ACCOUNT RECOVERY</div><h1>Forgot SahiMilo PIN?</h1><p>Registered Gmail enter karein. Account milne par secure reset link Gmail par bheja jayega.</p><form id="forgotPinForm" class="account-form"><label class="field"><span>Registered Gmail *</span><input id="recoveryEmail" type="email" autocomplete="email" required placeholder="yourname@gmail.com"></label><button id="recoverySubmit" class="primary-btn" type="submit">Send Reset Link</button><p id="recoveryMessage" class="notice hidden" role="alert"></p></form><p class="account-note">Apna registered Gmail yaad nahi hai? Government ID aur registered mobile number ke saath SahiMilo support se contact karein.</p></section></main></body></html>
